  - id: SRC-024
    revision: 1
    supersedes_revision: null
    source_kind: journal_article_accepted_manuscript
    author_or_institution: Arturo S. Leon and Ling Zhu
    title: A dimensional analysis for determining optimal discharge and penstock diameter in impulse and reaction water turbines
    edition_or_version: 'Renewable Energy, volume 71 (2014), pages 609–615; accepted manuscript'
    locator: 'https://ir.library.oregonstate.edu/downloads/1v53jz652, printed pages 3–4, equations (1), (2), (4), and (6); DOI: 10.1016/j.renene.2014.06.024'
    consulted_at: '2026-11-22'
    consulted_by: authorized_research_session
    applicable_excerpt: 'Equation (1) expresses electrical power in W as efficiency times water specific weight, discharge, and gross head minus summed head losses. Equations (2) and (4) express penstock loss with Q² multiplied by a geometry/local-loss/friction-factor term. The derivation assumes constant overall efficiency; the discussion on printed page 6 limits its near-constant friction-factor observation to its stated fully developed turbulent-flow context.'
    applicability_domain: 'Bounded support for a Q² dependence under fixed geometry and stated flow/friction assumptions in impulse/reaction turbine penstocks; not support for one universal K_loss, every flow regime, EcoGrid-specific penstock geometry, or approval of the proposed model.'
    access_authorization_ref: {id: ACCESS-003, revision: 1}
    retention_mode: metadata_only
    retention_permission_ref: null
    local_copy_path: null
    content_sha256: null
    status: consulted_verified
