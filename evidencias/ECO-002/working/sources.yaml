    source_kind: institutional_publication
    author_or_institution: Japan International Cooperation Agency; Electric Power Development Co., Ltd.; JP Design Co., Ltd.
    title: 'Guideline and Manual for Hydropower Development, Vol. 2: Small Scale Hydropower'
    edition_or_version: March 2011, IDD JR 11-020
    locator: 'https://openjicareport.jica.go.jp/pdf/12024899.pdf, §3.1.2, printed page 3-1; §5.3.1(6), printed page 5-12; §8.3.2(2), printed pages 8-10–8-11'
    consulted_at: '2026-11-22'
    consulted_by: authorized_research_session
    applicable_excerpt: '§3.1.2 states P=ρ·9.8·Q·He·η, with P in kW, ρ=1000 kg/m³, g≈9.8 m/s², Q in m³/s, He effective head in m, and combined turbine-generator efficiency. §5.3.1(6) defines effective head as total head minus intake, headrace, penstock, tailrace, and other losses.'
    applicability_domain: 'Small-scale hydropower planning formulation and its stated units; supports a bounded SI-form relation and an effective-head definition, but does not approve the EcoGrid 9.81 constant, simplified K_loss·Q² law, turbine boundary, or environmental-flow scenario.'
