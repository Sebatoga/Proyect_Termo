    applicable_excerpt: 'The help states that PVWatts V5 uses the Fuentes thermal model, while V8 updates module thermal modeling to the SAM Detailed PV implementation and uses an NOCT cell-temperature method; listed NOCT defaults differ by array type.'
    applicability_domain: 'Version boundary and documented model choices only; it does not establish equivalence between either PVWatts version and EcoGrid’s candidate lumped transient thermal balance, nor select a production model or module configuration.'
