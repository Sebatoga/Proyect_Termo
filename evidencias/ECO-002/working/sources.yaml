    locator: 'https://sam.nlr.gov/images/web_page_files/sam-help-2025-4-16.pdf, PVWatts section, About PVWatts Versions and New features added in Version 8; current help: https://samrepo.nlr.gov/help/pvwatts.html'
    consulted_at: '2026-11-22'
