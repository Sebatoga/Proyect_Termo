schema_version: 1
source_separation_notice: These records describe academic obligations only and are not technical support for equations, parameters, or ranges.
requirements:
  - id: ACA-REQ-001
    revision: 1
    supersedes_revision: null
    source_ref: {id: SRC-001, revision: 1}
    page: 1
    section: '1. Presentación y filosofía del proyecto — Alcance técnico mínimo'
    exact_excerpt: 'El juego deberá representar, mediante variables, reglas y consecuencias observables, al menos un fenómeno de termodinámica y uno de mecánica de fluidos.'
    interpretation: EcoGrid must include at least one active thermodynamic phenomenon and one active fluid-mechanics phenomenon.
    requires_evidence_for:
      - {id: SCI-EQ-PV-001, revision: 1}
      - {id: SCI-EQ-HYD-004, revision: 1}
  - id: ACA-REQ-002
    revision: 1
    supersedes_revision: null
    source_ref: {id: SRC-001, revision: 1}
    page: 1
    section: '1. Presentación y filosofía del proyecto — Alcance técnico mínimo'
    exact_excerpt: 'El modelo deberá incluir las hipótesis empleadas, las variables de entrada y salida, las ecuaciones principales, las unidades de medida, los límites de operación y un procedimiento de validación.'
    interpretation: Every selected model needs explicit assumptions, I/O, equations, units, limits, and a validation procedure.
    requires_evidence_for:
      - {id: SCI-CLM-CROSS-001, revision: 1}
  - id: ACA-REQ-003
    revision: 1
    supersedes_revision: null
    source_ref: {id: SRC-001, revision: 1}
    page: 1
    section: '1. Presentación y filosofía del proyecto — Alcance técnico mínimo'
    exact_excerpt: 'Las simplificaciones serán admisibles siempre que estén explícitamente justificadas y no produzcan interpretaciones físicamente incorrectas.'
    interpretation: Simplifications require explicit justification and must not create physically incorrect interpretations.
    requires_evidence_for:
      - {id: SCI-CLM-CROSS-002, revision: 1}
  - id: ACA-REQ-004
    revision: 1
    supersedes_revision: null
    source_ref: {id: SRC-001, revision: 1}
    page: 2
    section: '3. Las 4 reglas de oro — Regla I'
    exact_excerpt: 'Los fenómenos de termodinámica y mecánica de fluidos deberán intervenir directamente en las decisiones, restricciones y resultados del juego.'
    interpretation: Scientific models must affect gameplay outcomes rather than appear as trivia or decoration.
    requires_evidence_for:
      - {id: SCI-CLM-CROSS-003, revision: 1}
  - id: ACA-REQ-005
    revision: 1
    supersedes_revision: null
    source_ref: {id: SRC-001, revision: 1}
    page: 2
    section: '4. Fases y entregables — Criterios generales de evaluación'
    exact_excerpt: 'En ambos entregables se valorarán: el rigor del modelo físico y matemático; la integración efectiva de termodinámica y mecánica de fluidos; la coherencia entre el modelo, las reglas y la experiencia de juego; el funcionamiento del hardware y el software; la calidad de la validación experimental o computacional.'
    interpretation: The assessment requires rigorous models, interdisciplinary integration, coherence, functioning technology, and documented validation quality.
    requires_evidence_for:
      - {id: SCI-CLM-CROSS-001, revision: 1}
      - {id: SCI-CLM-CROSS-003, revision: 1}
  - id: ACA-REQ-006
    revision: 1
    supersedes_revision: null
    source_ref: {id: SRC-001, revision: 1}
    page: 3
    section: 'Entregable 2 — Evidencias obligatorias para la sustentación final'
    exact_excerpt: 'Cada equipo deberá presentar: el modelo físico y matemático implementado; una comparación entre los resultados esperados y los obtenidos; pruebas de funcionamiento bajo condiciones normales y condiciones límite; registro de errores, ajustes y decisiones de diseño.'
    interpretation: Final evidence must include expected-versus-observed comparisons, normal and boundary conditions, and a traceable decision/error record.
    requires_evidence_for:
      - {id: SCI-CLM-CROSS-004, revision: 1}
  - id: ACA-REQ-007
    revision: 1
    supersedes_revision: null
    source_ref: {id: SRC-001, revision: 1}
    page: 4
    section: '5. Las categorías de inscripción — Liga 4'
    exact_excerpt: 'Enfoque: Termodinámica aplicada a Energías Alternativas.'
    interpretation: The selected league requires thermodynamics applied to alternative energy.
    requires_evidence_for:
      - {id: SCI-EQ-PV-001, revision: 1}
